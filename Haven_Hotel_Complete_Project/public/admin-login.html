<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Administration Access | Haven Hotel</title>
  <link rel="stylesheet" href="/admin-login.css">
</head>
<body>
  <main class="login-card">
    <div class="login-brand">
      <a class="logo" href="/">HAVEN<span>.</span></a>
      <span class="login-badge">STAFF MANAGEMENT PORTAL</span>
    </div>

    <h1>Property Login</h1>
    <p class="muted">Enter your administrative credentials to manage hotel operations.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" required autocomplete="username" placeholder="e.g. admin">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••••••">
      </div>

      <button type="submit">Authenticate Session →</button>
      <p id="loginMessage" aria-live="polite"></p>
    </form>

    <a class="back-link" href="/">← Return to Public Website</a>
  </main>

  <script src="/admin-login.js"></script>
</body>
</html>
